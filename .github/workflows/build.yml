# Package Octavo only after merge to main (not on PRs).
# Matrix: Linux/Windows × amd64/arm64 as feasible — see .github/CI.md for gaps.
name: Build

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: GitVersion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          disableShallowCloneCheck: true

      - name: Summary
        run: |
          {
            echo "## GitVersion"
            echo "- SemVer: \`${{ steps.gitversion.outputs.semVer }}\`"
            echo "- FullSemVer: \`${{ steps.gitversion.outputs.fullSemVer }}\`"
            echo "- MajorMinorPatch: \`${{ steps.gitversion.outputs.majorMinorPatch }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            platform: linux
            arch: x86_64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - name: windows-amd64
            runner: windows-latest
            platform: windows
            arch: x86_64
          # windows-arm64 (windows-11-arm) omitted — see .github/CI.md gaps
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Stamp SemVer into app manifests
        shell: bash
        run: node scripts/apply-version.mjs "${{ needs.version.outputs.majorMinorPatch }}"

      - name: Install Linux Tauri deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.name }}

      - name: Build Tauri app
        # Prefer CLI so we do not need write permissions / releases.
        run: npm run tauri:build
        env:
          # Surface version for any tooling that reads CI vars
          OCTAVO_VERSION: ${{ needs.version.outputs.semVer }}
          TAURI_BUNDLE_VERSION: ${{ needs.version.outputs.majorMinorPatch }}

      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: octavo-${{ needs.version.outputs.semVer }}-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle
            src-tauri/target/release/octavo*
            src-tauri/target/release/octavo.exe
          if-no-files-found: warn
          retention-days: 14
