version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    groups:
      production-npm:
        dependency-type: production
      development-npm:
        dependency-type: development
    # typescript-eslint@8 peer: typescript >=4.8.4 <6.1.0 — TS 7 breaks npm ci (ERESOLVE).
    # Revisit when typescript-eslint peers allow TypeScript 7+.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
